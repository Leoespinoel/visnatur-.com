<body>
  <div class="bg"></div>
  <div class="panel">
    <span class="badger"></span>
    <p class="word" id="word"></p>
    <p class="tag">Numbered editions. Made once you order it.</p>
  </div>
<script>
  // Same shuffle as the site's intro: letters cycle random capitals (Æ weighted) and settle left
  // to right; later letters take longer; the Æ gets an extra beat. Times are ms from the shuffle start.
  const TEXT = "VIS NATURÆ";
  const POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZÆÆÆ";
  const SHUFFLE_START = 450, LAST = 2650;
  const letters = [...TEXT];
  const nonSpace = letters.map((ch, i) => (ch === " " ? -1 : i)).filter((i) => i >= 0);
  const n = nonSpace.length;
  const settleAt = (k) => (k === n - 1 ? LAST : 250 + 1700 * Math.pow(k / (n - 1), 1.7));
  const tick = (e) => 45 + 125 * Math.min(1, Math.pow(e / LAST, 1.5));
  const hash = (a, b) => { let h = 2166136261 ^ (a * 16777619); h = Math.imul(h ^ b, 16777619); h ^= h >>> 13; h = Math.imul(h, 1274126177); return (h ^ (h >>> 16)) >>> 0; };

  const word = document.getElementById("word");
  const els = letters.map((ch, i) => {
    const s = document.createElement("span");
    s.className = "letter" + (i === letters.length - 1 ? " ae" : "") + (ch === " " ? " space" : "");
    s.style.setProperty("--i", i);
    s.textContent = ch;
    word.appendChild(s);
    return s;
  });

  window.render = (ms) => {
    const e = ms - SHUFFLE_START;
    letters.forEach((ch, i) => {
      if (ch === " ") return;
      const k = nonSpace.indexOf(i);
      els[i].textContent = e < settleAt(k) ? POOL[hash(i, Math.floor(Math.max(0, e) / tick(Math.max(0, e)))) % POOL.length] : ch;
    });
    document.getAnimations().forEach((a) => { a.currentTime = ms; });
  };
  window.ready = document.fonts.ready.then(() => true);
</script>
